<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:;">
    <title>eDEXlite</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="grid">
      <header class="bar">
        <h1>eDEX<span>lite</span></h1>
        <div id="clock"></div>
      </header>

      <section class="panel stats">
        <h2>System</h2>
        <div class="kv"><label>Host</label><span id="host">-</span></div>
        <div class="kv"><label>OS</label><span id="os">-</span></div>
        <div class="kv"><label>CPU Load</label><span id="cpuload">-</span></div>
        <div class="kv"><label>Temp</label><span id="cputemp">-</span></div>
        <div class="kv"><label>Memory</label><span id="mem">-</span></div>
      </section>

      <section class="terminal">
        <div id="terminal"></div>
      </section>

      <section class="panel net">
        <h2>Network</h2>
        <div id="netlist"></div>
      </section>

      <section class="panel disks">
        <h2>Disks</h2>
        <div id="disklist"></div>
      </section>

      <footer class="bar small">
        <div>Type to use the terminal • Ctrl+L to clear</div>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
