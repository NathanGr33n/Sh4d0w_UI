<!doctype html>
<!-- By: NathanGr33n -->
<html>
<head>
<meta charset="utf-8"><title>ShadowUI</title>
<!-- Security: Using specific versions with SRI hashes to prevent supply chain attacks -->
<link rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
      integrity="sha384-Z41J5sLdHgTEjZfH0nV0vLbT9dFKdXjKbFfEyZ7o7b0CvhYIWPbv6KQ4dWnNzNDY"
      crossorigin="anonymous">
<link rel="stylesheet" href="styles-paranoid-ubuntu.css">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
</head><body>
<main class="grid">
<header class="bar"><h1>Shadow<span>UI</span></h1><div id="clock"></div></header>
<section class="panel stats"><h2>System</h2>
<div class="kv"><label>Host</label><span id="host">-</span></div>
<div class="kv"><label>OS</label><span id="os">-</span></div>
<div class="kv"><label>CPU Load</label><span id="cpuload">-</span></div>
<div class="kv"><label>Temp</label><span id="cputemp">-</span></div>
<div class="kv"><label>Memory</label><span id="mem">-</span></div></section>
<section class="terminal"><div id="terminal"></div></section>
<section class="panel net"><h2>Network</h2><div id="netlist"></div></section>
<section class="panel disks"><h2>Disks</h2><div id="disklist"></div></section>
<footer class="bar small"><div>Type to use the terminal • Ctrl+L to clear</div></footer>
</main>
<!-- Security: CDN scripts with SRI for supply chain protection -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"
        integrity="sha384-V3hKWaJa0eBPfGVE2o7pQ6GCnXLqrSYqO7YvY9+OPYnhXRj2WhV6vK5lM2rCNmHq"
        crossorigin="anonymous"></script>
<!-- Context Menu -->
<div id="context-menu" class="context-menu hidden">
  <div class="context-menu-item" data-action="copy">Copy</div>
  <div class="context-menu-item" data-action="paste">Paste</div>
  <div class="context-menu-separator"></div>
  <div class="context-menu-item" data-action="selectall">Select All</div>
  <div class="context-menu-item" data-action="clear">Clear Terminal</div>
  <div class="context-menu-separator"></div>
  <div class="context-menu-item" data-action="preferences">Preferences...</div>
</div>

<!-- Preferences Panel Modal -->
<div id="preferences-overlay" class="prefs-overlay hidden">
  <div class="prefs-panel">
    <div class="prefs-header">
      <h2>Preferences</h2>
      <button class="prefs-close" title="Close (ESC)">×</button>
    </div>
    <div class="prefs-content">
      <div class="prefs-section">
        <h3>Monitoring</h3>
        <label><input type="checkbox" id="pref-metric-cpu"> CPU Load</label>
        <label><input type="checkbox" id="pref-metric-memory"> Memory</label>
        <label><input type="checkbox" id="pref-metric-network"> Network</label>
        <label><input type="checkbox" id="pref-metric-disk"> Disk</label>
        <label><input type="checkbox" id="pref-metric-battery"> Battery</label>
        <label><input type="checkbox" id="pref-metric-temperature"> Temperature</label>
        <hr>
        <label><input type="checkbox" id="pref-adaptive-polling"> Adaptive Polling</label>
        <label><input type="checkbox" id="pref-slow-when-minimized"> Slow Poll When Minimized</label>
        <label>
          Poll Interval (ms):
          <input type="number" id="pref-poll-interval" min="500" max="10000" step="100">
        </label>
        <label>
          Minimized Interval (ms):
          <input type="number" id="pref-minimized-interval" min="2000" max="30000" step="1000">
        </label>
      </div>
      <div class="prefs-section">
        <h3>Terminal</h3>
        <label>
          Font Size:
          <input type="number" id="pref-font-size" min="8" max="24">
        </label>
      </div>
      <div class="prefs-section">
        <h3>Security</h3>
        <label><input type="checkbox" id="pref-enable-logging"> Enable Logging</label>
        <label>
          Log Level:
          <select id="pref-log-level">
            <option value="error">Error</option>
            <option value="warn">Warning</option>
            <option value="info">Info</option>
          </select>
        </label>
      </div>
    </div>
    <div class="prefs-footer">
      <button class="prefs-save">Save</button>
      <button class="prefs-reset">Reset to Defaults</button>
      <button class="prefs-cancel">Cancel</button>
    </div>
  </div>
</div>
<script src="errorBoundary.js"></script>
<script src="renderer.js"></script>
</body></html>
